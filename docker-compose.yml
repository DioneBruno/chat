# Infra completa da POC: `docker compose up` sobe tudo.
#
# Typebot v3.19.0 (release oficial de 2026-09-14, imagens baptistearno/typebot-*),
# Postgres, Redis, Mailpit, Centrifugo, API NestJS e front Vue 3.
# Variáveis opcionais em ./.env (ver .env.example); sem ele valem os defaults abaixo.

x-typebot-common: &typebot-common
  restart: unless-stopped
  depends_on:
    typebot-redis:
      condition: service_healthy
    typebot-db:
      condition: service_healthy
  networks:
    - platform-network
  environment: &typebot-env
    ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-poc-encryption-secret-0123456789}
    DATABASE_URL: postgresql://postgres:typebot@typebot-db:5432/typebot
    REDIS_URL: redis://typebot-redis:6379
    NODE_OPTIONS: --no-node-snapshot
    NEXTAUTH_URL: http://localhost:8082
    NEXT_PUBLIC_VIEWER_URL: http://localhost:8081
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@poc.local}
    # Login por magic link via Mailpit. Com SMTP_AUTH_DISABLED=true o login por e-mail é desativado.
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_SECURE: "false"
    SMTP_AUTH_DISABLED: "false"
    NEXT_PUBLIC_SMTP_FROM: "Typebot POC <notifications@poc.local>"
x-chatwoot-common: &chatwoot-common
  image: chatwoot/chatwoot:v4.18.0
  restart: unless-stopped
  depends_on:
    chatwoot-db:
      condition: service_healthy
    chatwoot-redis:
      condition: service_healthy
  networks:
    - platform-network
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-poc-chatwoot-secret-key-base-0123456789abcdef0123456789abcdef0123456789abcdef}
    FRONTEND_URL: http://localhost:3000
    POSTGRES_HOST: chatwoot-db
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: postgres
    POSTGRES_PASSWORD: chatwoot
    REDIS_URL: redis://chatwoot-redis:6379
    ENABLE_ACCOUNT_SIGNUP: "false"
    MAILER_SENDER_EMAIL: Chatwoot POC <chatwoot@poc.local>
    SMTP_ADDRESS: mailpit
    SMTP_PORT: "1025"
    SMTP_AUTHENTICATION: ""
    SMTP_ENABLE_STARTTLS_AUTO: "false"
    LOG_LEVEL: info
    # POC: o Sidekiq precisa entregar webhooks ao Nest na rede docker (hostname "api"). A chave é global (não há allowlist por host).
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"

services:
  typebot-db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: typebot
      POSTGRES_PASSWORD: typebot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  typebot-redis:
    image: redis:alpine
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis-data:/data
    networks:
      - platform-network

  typebot-builder:
    <<: *typebot-common
    image: baptistearno/typebot-builder:3.19.0
    ports:
      - "8082:3000"

  typebot-viewer:
    <<: *typebot-common
    image: baptistearno/typebot-viewer:3.19.0
    ports:
      - "8081:3000"
    # POC #2: o bloco HTTP do fluxo chama http://api:3001. O Typebot bloqueia redes privadas
    # (SSRF); SSRF_ALLOWED_HOSTS libera só o hostname da nossa API.
    environment:
      <<: *typebot-env
      SSRF_ALLOWED_HOSTS: api

  # --- POC #4: banco da plataforma (NestJS), separado do Typebot e do Chatwoot ---
  platform-db:
    image: postgres:16
    container_name: chat-api-database
    restart: unless-stopped
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    networks:
      - platform-network

  # --- POC #3: Chatwoot v4.18.0 (painel do atendente) em http://localhost:3000 ---
  # Banco e Redis próprios: não compartilha dados com Typebot nem com a plataforma.
  chatwoot-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - chatwoot-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform-network

  chatwoot-redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chatwoot-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      retries: 5
    networks:
      - platform-network

  chatwoot-rails:
    <<: *chatwoot-common
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "3000:3000"

  chatwoot-sidekiq:
    <<: *chatwoot-common
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # SMTP descartável só para capturar o magic link de login do builder.
  # UI web em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - platform-network

  # Realtime. API HTTP e WebSocket em http://localhost:8000
  # (segredos só da POC; a API usa os mesmos valores por padrão).
  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    command: centrifugo
    ports:
      - "8000:8000"
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: poc-hmac-secret
      CENTRIFUGO_HTTP_API_KEY: poc-api-key
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "http://localhost:5173"
      CENTRIFUGO_HTTP_API_INSECURE: "false"
      # Canais "attendance:<id>" exigem o namespace declarado (senão: unknown channel).
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"attendance"}]'
    networks:
      - platform-network

  # API NestJS em http://localhost:3001 (o front aponta para essa porta).
  # TYPEBOT_ID e TYPEBOT_API_TOKEN só existem depois de configurar o builder:
  # preencha no .env e rode `docker compose up -d api`.
  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
      typebot-viewer:
        condition: service_started
      centrifugo:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://platform:${PLATFORM_DB_PASSWORD:-platform}@platform-db:5432/platform
      # Segredo de assinatura das sessões de acesso ao chat (POC; trocar em produção).
      ACCESS_SESSION_SECRET: ${ACCESS_SESSION_SECRET:-poc-access-session-secret-change-me}
      TYPEBOT_API_URL: http://typebot-viewer:3000/api
      TYPEBOT_ID: ${TYPEBOT_ID:-}
      TYPEBOT_API_TOKEN: ${TYPEBOT_API_TOKEN:-}
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: poc-api-key
      CENTRIFUGO_HMAC_SECRET: poc-hmac-secret
      # Etapa 5: assina as credenciais de execução entregues aos fluxos do Typebot (trocar em produção).
      BOT_EXECUTION_SECRET: ${BOT_EXECUTION_SECRET:-poc-bot-execution-secret-change-me}
      OP_SIMULATED_MS: ${OP_SIMULATED_MS:-5000}
      ASYNC_RESUME_MODE: ${ASYNC_RESUME_MODE:-continue}
      # Seed do tenant "poc": fluxos publicados no Typebot (public IDs) e a ação do fluxo poc-async
      # (`customer.requests.list`; use `customer.requests.fail` para exercitar a falha).
      POC_BOT_ACTION: ${POC_BOT_ACTION:-customer.requests.list}
      TYPEBOT_POST_SERVICE_ID: ${TYPEBOT_POST_SERVICE_ID:-poc-post-service}
      # Chatwoot (valores de POC; o token é do usuário atendente@poc.local criado no seed)
      CHATWOOT_API_URL: http://chatwoot-rails:3000
      CHATWOOT_ACCOUNT_ID: "1"
      CHATWOOT_INBOX_ID: "1"
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-f4Yid8AzhGiq9v1oNoUZu25J}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-mC59WRiiy5fTpqVL5oYW4zNJ}
    networks:
      - platform-network

  # Chat Vue 3 em http://localhost:5173
  web:
    build: ./apps/web-poc
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  chatwoot-db-data:
  chatwoot-redis-data:
  platform-db-data:
